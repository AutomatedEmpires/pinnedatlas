name: Feature Request
description: Propose a product-backed engineering task.
title: "[feature] <area>: <summary>"
labels:
  - status:ready
body:
  - type: input
    id: area
    attributes:
      label: Area
    validations:
      required: true
  - type: textarea
    id: source-of-truth
    attributes:
      label: Source of truth
      description: Link the Notion page, decision, or spec.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      render: bash
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - risk:low
        - risk:medium
        - risk:high
        - risk:approval-required
    validations:
      required: true