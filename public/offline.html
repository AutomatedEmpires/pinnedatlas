<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Offline · PinnedAtlas</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #0c0a09; color: #f5f5f4;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      main { width: 100%; max-width: 28rem; text-align: center; }
      .badge {
        width: 64px; height: 64px; border-radius: 9999px; background: #1c1917;
        display: inline-flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 8px;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 12px 0 6px; }
      p { color: #a8a29e; font-size: 14px; line-height: 1.6; margin: 0 auto 18px; max-width: 22rem; }
      ul { list-style: none; padding: 0; margin: 0 0 18px; text-align: left; }
      li { border-bottom: 1px solid #292524; }
      li a {
        display: block; padding: 12px 14px; color: #f5f5f4; text-decoration: none; font-size: 14px; font-weight: 500;
      }
      li a:hover { background: #1c1917; }
      li.muted { color: #78716c; font-size: 13px; padding: 12px 14px; }
      .section-label { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #78716c; margin: 0 0 6px; }
      .btn {
        display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px;
        border-radius: 10px; background: #34d399; color: #0c0a09; font-weight: 600; font-size: 14px;
        text-decoration: none;
      }
      .card { background: #1c1917; border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">🧭</div>
      <h1>You&rsquo;re offline</h1>
      <p>No signal out here — often a good sign. Your downloaded spots are still available below.</p>
      <div id="downloads"></div>
      <a class="btn" href="/">Back to the map</a>
    </main>
    <script>
      (function () {
        try {
          var spots = JSON.parse(localStorage.getItem('pa:offline-spots') || '[]');
          var host = document.getElementById('downloads');
          if (!Array.isArray(spots) || spots.length === 0) {
            host.innerHTML =
              '<div class="card"><ul><li class="muted">No downloaded spots yet. Tap &ldquo;Download for offline&rdquo; on any spot while you have signal to keep it here.</li></ul></div>';
            return;
          }
          var label = document.createElement('p');
          label.className = 'section-label';
          label.textContent = 'Downloaded (' + spots.length + ')';
          host.appendChild(label);
          var card = document.createElement('div');
          card.className = 'card';
          var ul = document.createElement('ul');
          spots.forEach(function (s) {
            if (!s || !s.slug) return;
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = '/location/' + s.slug;
            a.textContent = s.name || s.slug;
            li.appendChild(a);
            ul.appendChild(li);
          });
          card.appendChild(ul);
          host.appendChild(card);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </body>
</html>
